name: Build Kraken Explorer

on:
  workflow_dispatch:  # enables manual trigger
    inputs:
      draft_release:
        description: Create (or refresh) the draft release <version> from this run's packages
        type: boolean
        default: false
  push:
    branches: [ "main", "master" ]
    tags: [ "[0-9]*" ]  # a tag like 0.0.3 builds the packages and attaches them to the release
  pull_request:
    branches: [ "main", "master" ]

env:
  # System packages from README. The X11/Wayland ones are only needed by GLFW,
  # so headless jobs configure with -DGLFW_BUILD_X11=OFF -DGLFW_BUILD_WAYLAND=OFF
  # and install just BUILD_DEPS.
  BUILD_DEPS: >-
    build-essential cmake ninja-build pkg-config
    libusb-1.0-0-dev zlib1g-dev libnl-3-dev libnl-route-3-dev python3-dev pybind11-dev libgl-dev
  GUI_DEPS: >-
    libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
    libwayland-dev libxkbcommon-dev wayland-protocols
  HEADLESS: -DGLFW_BUILD_X11=OFF -DGLFW_BUILD_WAYLAND=OFF

jobs:
  unit-tests:
    name: Unit tests (doctest, ASan + UBSan)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ env.BUILD_DEPS }} ${{ env.GUI_DEPS }}

    # FetchContent downloads (imgui, glfw, ...). Only sources and download stamps
    # are cached; *-build dirs are rebuilt with this run's flags.
    - &fetch_cache
      name: Cache FetchContent dependencies
      uses: actions/cache@v5
      with:
        path: |
          build/_deps
          !build/_deps/*-build
        key: fetchcontent-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}

    # Tests that need vcan0/vcan1 skip themselves when these are missing, and the
    # vcan module is not guaranteed to exist for the runner's kernel.
    - name: Set up vcan0 / vcan1
      continue-on-error: true
      run: |
        sudo modprobe vcan || {
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
        }
        for i in 0 1; do
          sudo ip link add dev vcan$i type vcan
          sudo ip link set up vcan$i
        done
        ip -brief link show type vcan

    - name: Configure
      run: cmake -S . -B build -G Ninja -DKRAKEN_SANITIZE=ON

    - name: Build
      run: cmake --build build

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  format-compat:
    name: Trace format compatibility (python-can, scapy, asammdf)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ env.BUILD_DEPS }} python3-venv

    - *fetch_cache

    - name: Install reference readers
      run: |
        python3 -m venv .venv
        .venv/bin/pip install -r tests/format_compat/requirements.txt

    - name: Build sample writer
      run: |
        cmake -S . -B build -G Ninja ${{ env.HEADLESS }}
        cmake --build build --target trace_format_samples

    - name: Write samples and read them back
      run: |
        # Every export format and split recorder output, checked by readers that
        # share no code with Kraken Explorer. See tests/format_compat/validate.py.
        build/tests/format_compat/trace_format_samples build/format_compat
        .venv/bin/python tests/format_compat/validate.py build/format_compat

  package:
    name: Build Kraken Explorer DEB + AppImage
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ env.BUILD_DEPS }} ${{ env.GUI_DEPS }} wget fuse libfuse2

    - *fetch_cache

    - name: Build DEB package
      env:
        DEB_MAINTAINER: Kristoffer Johansson <https://github.com/stoffej>
      run: |
        # The Kvaser driver loads libcanlib at run time: nothing to install or bundle here.
        scripts/build_deb.sh build
        dpkg-deb --info build/*.deb

    - name: Read version
      run: |
        # project(kraken_explorer VERSION x.y.z ...) in the top-level CMakeLists.txt
        PKG_VERSION=$(sed -nE 's/^project\(kraken_explorer VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
        test -n "$PKG_VERSION"
        echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

    - name: Prepare AppDir
      run: |
        install -Dm755 -s build/src/kraken-explorer AppDir/usr/bin/kraken-explorer
        install -Dm644 packaging/kraken-explorer.png AppDir/usr/share/icons/hicolor/256x256/apps/kraken-explorer.png
        mkdir -p AppDir/usr/share/applications
        sed 's|Exec=/usr/bin/kraken-explorer %f|Exec=kraken-explorer %f|' kraken-explorer.desktop \
          > AppDir/usr/share/applications/kraken-explorer.desktop

    - name: Bundle Python runtime
      run: |
        # linuxdeploy bundles libpython, but its compiled-in prefix points at this
        # runner. Ship the matching stdlib as usr/lib/pythonX.Y: python_engine sets
        # PYTHONHOME to <prefix> when <prefix>/lib/pythonX.Y/os.py exists next to bin/.
        PY_PREFIX=$(pkg-config --variable=prefix python3-embed)
        PYVER=$(pkg-config --modversion python3-embed | cut -d. -f1,2)
        echo "linked against Python ${PYVER} in ${PY_PREFIX}"

        SRC="${PY_PREFIX}/lib/python${PYVER}"
        test -f "${SRC}/os.py" || { echo "ERROR: stdlib not found at ${SRC}"; exit 1; }

        DST="AppDir/usr/lib/python${PYVER}"
        mkdir -p "${DST}"
        cp -r "${SRC}"/. "${DST}"/
        # Trim what the embedded interpreter never needs.
        rm -rf "${DST}/test" "${DST}/idlelib" "${DST}/tkinter" "${DST}/turtledemo"
        find "${DST}" -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
        find "${DST}" -type d -name tests -exec rm -rf {} + 2>/dev/null || true

        # pybind11 needs the encodings codec at startup; lib-dynload carries the
        # C extension modules (_socket, zlib, ...) and must come along.
        test -f "${DST}/encodings/__init__.py"
        ls "${DST}/lib-dynload" >/dev/null

    - name: Build AppImage
      env:
        LINUXDEPLOY_OUTPUT_VERSION: ${{ env.PKG_VERSION }}
      run: |
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage
        # No Qt plugin any more: GLFW loads X11/Wayland/GL from the host at runtime,
        # linuxdeploy bundles the rest (libpython, libnl, libusb, libcanlib).
        ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
        ls -la Kraken*.AppImage

    - name: Upload DEB package
      uses: actions/upload-artifact@v6
      with:
        name: KrakenExplorer-Linux-DEB
        path: "build/*.deb"

    - name: Upload AppImage
      uses: actions/upload-artifact@v6
      with:
        name: KrakenExplorer-Linux-AppImage
        path: "Kraken*.AppImage"

  windows:
    name: Windows (MinGW-w64) tests + zip + installer
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    # The python.org build: the exe links its python3xx.dll and the zip ships the embeddable
    # package of the same version. MSYS2's own Python is a different ABI and must not be found.
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Set up MinGW-w64 (MSYS2 UCRT64)
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja

    # build_win_zip.ps1 builds the setup.exe when it finds Inno Setup.
    - name: Set up Inno Setup
      shell: pwsh
      run: |
        if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

    # Code signing: SignPath Foundation (free for open source) signs kraken-explorer.exe and
    # then setup.exe in its cloud; each pass uploads the unsigned file as a GitHub artifact and
    # waits for the signed one. Without the SIGNPATH_API_TOKEN secret (pull requests, forks)
    # the packages are built unsigned. Setup: docs/windows-port.md "Code signing".
    - name: Build and stage
      shell: pwsh
      env:
        # Tests on: the same build tree runs ctest below.
        CMAKE_ARGS: -DKRAKEN_TESTS=ON -DPython_ROOT_DIR=${{ env.pythonLocation }} -DPython_FIND_STRATEGY=LOCATION -DPython_FIND_REGISTRY=NEVER
      run: |
        $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
        g++ --version
        scripts\build_win_zip.ps1 -Build build -StageOnly
        $Stage = (Get-Item build\kraken-explorer-*-win64).FullName
        "STAGE=$Stage" >> $env:GITHUB_ENV

    - name: Upload unsigned exe
      id: unsigned-exe
      if: env.SIGNPATH_API_TOKEN != ''
      uses: actions/upload-artifact@v6
      with:
        name: unsigned-exe
        path: ${{ env.STAGE }}/kraken-explorer.exe
        retention-days: 1

    - name: Sign exe
      if: env.SIGNPATH_API_TOKEN != ''
      uses: signpath/github-action-submit-signing-request@v1
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: kraken-explorer
        signing-policy-slug: ${{ github.ref_type == 'tag' && 'release-signing' || 'test-signing' }}
        github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: ${{ env.STAGE }}

    - name: Zip and installer
      shell: pwsh
      run: |
        scripts\build_win_zip.ps1 -Build build -PackageOnly
        if (-not (Test-Path build\kraken-explorer-*-win64-setup.exe)) { throw "no setup.exe built" }

    - name: Upload unsigned installer
      id: unsigned-setup
      if: env.SIGNPATH_API_TOKEN != ''
      uses: actions/upload-artifact@v6
      with:
        name: unsigned-setup
        path: build/kraken-explorer-*-win64-setup.exe
        retention-days: 1

    - name: Sign installer
      if: env.SIGNPATH_API_TOKEN != ''
      uses: signpath/github-action-submit-signing-request@v1
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: kraken-explorer
        signing-policy-slug: ${{ github.ref_type == 'tag' && 'release-signing' || 'test-signing' }}
        github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
        wait-for-completion: true
        output-artifact-directory: build

    - name: Build and run tests
      shell: pwsh
      run: |
        $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
        cmake --build build
        ctest --test-dir build --output-on-failure

    - name: Upload zip
      uses: actions/upload-artifact@v6
      with:
        name: KrakenExplorer-Windows-zip
        path: "build/kraken-explorer-*-win64.zip"

    - name: Upload installer
      uses: actions/upload-artifact@v6
      with:
        name: KrakenExplorer-Windows-setup
        path: "build/kraken-explorer-*-win64-setup.exe"
        if-no-files-found: error

  release:
    name: Draft release
    if: github.ref_type == 'tag' || inputs.draft_release
    needs: [unit-tests, format-compat, package, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Download packages
      uses: actions/download-artifact@v7
      with:
        path: dist
        pattern: KrakenExplorer-*
        merge-multiple: true

    # A new release is a draft, published by hand on the releases page (which also creates the
    # tag when the run was started manually). An existing release for the tag, draft or
    # published, gets this run's packages.
    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(sed -nE 's/^project\(kraken_explorer VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
        TAG="$VERSION"
        if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match version $VERSION in CMakeLists.txt"
          exit 1
        fi
        ls -la dist
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" dist/* --clobber
        else
          gh release create "$TAG" dist/* --draft --generate-notes --target "$GITHUB_SHA" --title "Kraken Explorer $VERSION"
        fi

name: Build Kraken Explorer

on:
  workflow_dispatch:  # enables manual trigger
    inputs:
      draft_release:
        description: Create (or refresh) the release <version> from this run's packages; published when run on a tag, kept as a draft when run on a branch
        type: boolean
        default: false
  push:
    branches: [ "main", "master" ]
    tags: [ "[0-9]*" ]  # a tag like 0.0.3 builds the packages and attaches them to the release
  pull_request:
    branches: [ "main", "master" ]

env:
  # System packages from README. The X11/Wayland ones are only needed by GLFW,
  # so headless jobs configure with -DGLFW_BUILD_X11=OFF -DGLFW_BUILD_WAYLAND=OFF
  # and install just BUILD_DEPS.
  BUILD_DEPS: >-
    build-essential cmake ninja-build pkg-config
    libusb-1.0-0-dev zlib1g-dev libnl-3-dev libnl-route-3-dev python3-dev pybind11-dev libgl-dev
  GUI_DEPS: >-
    libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
    libwayland-dev libxkbcommon-dev wayland-protocols
  HEADLESS: -DGLFW_BUILD_X11=OFF -DGLFW_BUILD_WAYLAND=OFF
  # Compiler cache: ccache on Linux and macOS (actions/cache, see &ccache), sccache with the
  # Actions cache backend on Windows. A clean build of this tree takes 12-17 minutes.
  CCACHE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
  SCCACHE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
  CCACHE_COMPILERCHECK: content  # runners reinstall the compiler: its mtime would miss every time
  CCACHE_MAXSIZE: 2G

jobs:
  unit-tests:
    name: Unit tests (doctest, ASan + UBSan)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ env.BUILD_DEPS }} ${{ env.GUI_DEPS }} ccache

    # FetchContent downloads (imgui, glfw, ...). Only sources and download stamps
    # are cached; *-build dirs are rebuilt with this run's flags.
    - &fetch_cache
      name: Cache FetchContent dependencies
      uses: actions/cache@v5
      with:
        path: |
          build/_deps
          !build/_deps/*-build
        key: fetchcontent-${{ runner.os }}-${{ hashFiles('cmake/deps.cmake') }}

    # One cache per OS and job (the flags differ), restored from the newest one of that job and
    # saved by &ccache_save at the end of the job even when a test failed: actions/cache alone
    # would drop a failed run's objects, and a failing run is exactly when the next push comes.
    - &ccache
      name: Restore compiler cache (ccache)
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cache/ccache
          ~/Library/Caches/ccache
        key: ccache-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: ccache-${{ runner.os }}-${{ github.job }}-

    # Tests that need vcan0/vcan1 skip themselves when these are missing, and the
    # vcan module is not guaranteed to exist for the runner's kernel.
    - name: Set up vcan0 / vcan1
      continue-on-error: true
      run: |
        sudo modprobe vcan || {
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe vcan
        }
        for i in 0 1; do
          sudo ip link add dev vcan$i type vcan
          sudo ip link set up vcan$i
        done
        ip -brief link show type vcan

    - name: Configure
      run: cmake -S . -B build -G Ninja -DKRAKEN_SANITIZE=ON ${{ env.CCACHE_ARGS }}

    - name: Build
      run: cmake --build build && ccache -s

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

    - &ccache_save
      name: Save compiler cache (ccache)
      if: always()
      uses: actions/cache/save@v5
      with:
        path: |
          ~/.cache/ccache
          ~/Library/Caches/ccache
        key: ccache-${{ runner.os }}-${{ github.job }}-${{ github.sha }}

  format-compat:
    name: Trace format compatibility (python-can, scapy, asammdf)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ env.BUILD_DEPS }} python3-venv ccache

    - *fetch_cache
    - *ccache

    - name: Install reference readers
      run: |
        python3 -m venv .venv
        .venv/bin/pip install -r tests/format_compat/requirements.txt

    - name: Build sample writer
      run: |
        cmake -S . -B build -G Ninja ${{ env.HEADLESS }} ${{ env.CCACHE_ARGS }}
        cmake --build build --target trace_format_samples

    - name: Write samples and read them back
      run: |
        # Every export format and split recorder output, checked by readers that
        # share no code with Kraken Explorer. See tests/format_compat/validate.py.
        build/tests/format_compat/trace_format_samples build/format_compat
        .venv/bin/python tests/format_compat/validate.py build/format_compat

    - *ccache_save

  package:
    name: Build Kraken Explorer DEB + AppImage
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # git describe: the version is the newest tag

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ env.BUILD_DEPS }} ${{ env.GUI_DEPS }} wget fuse libfuse2 ccache

    - *fetch_cache
    - *ccache

    - name: Build DEB package
      env:
        DEB_MAINTAINER: Kristoffer Johansson <https://github.com/stoffej>
        CMAKE_ARGS: ${{ env.CCACHE_ARGS }}
      run: |
        # The Kvaser driver loads libcanlib at run time: nothing to install or bundle here.
        scripts/build_deb.sh build
        ccache -s
        dpkg-deb --info build/*.deb

    - *ccache_save

    - name: Read version
      run: |
        # From the git tag, as configured by build_deb.sh (top-level CMakeLists.txt)
        PKG_VERSION=$(sed -n 's/^CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)
        test -n "$PKG_VERSION"
        echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

    - name: Prepare AppDir
      run: |
        install -Dm755 -s build/src/kraken-explorer AppDir/usr/bin/kraken-explorer
        install -Dm644 packaging/kraken-explorer.png AppDir/usr/share/icons/hicolor/256x256/apps/kraken-explorer.png
        mkdir -p AppDir/usr/share/applications
        sed 's|Exec=/usr/bin/kraken-explorer %f|Exec=kraken-explorer %f|' kraken-explorer.desktop \
          > AppDir/usr/share/applications/kraken-explorer.desktop

    - name: Bundle Python runtime
      run: |
        # linuxdeploy bundles libpython, but its compiled-in prefix points at this
        # runner. Ship the matching stdlib as usr/lib/pythonX.Y: python_engine sets
        # PYTHONHOME to <prefix> when <prefix>/lib/pythonX.Y/os.py exists next to bin/.
        PY_PREFIX=$(pkg-config --variable=prefix python3-embed)
        PYVER=$(pkg-config --modversion python3-embed | cut -d. -f1,2)
        echo "linked against Python ${PYVER} in ${PY_PREFIX}"

        SRC="${PY_PREFIX}/lib/python${PYVER}"
        test -f "${SRC}/os.py" || { echo "ERROR: stdlib not found at ${SRC}"; exit 1; }

        DST="AppDir/usr/lib/python${PYVER}"
        mkdir -p "${DST}"
        cp -r "${SRC}"/. "${DST}"/
        # Trim what the embedded interpreter never needs.
        rm -rf "${DST}/test" "${DST}/idlelib" "${DST}/tkinter" "${DST}/turtledemo"
        find "${DST}" -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
        find "${DST}" -type d -name tests -exec rm -rf {} + 2>/dev/null || true

        # pybind11 needs the encodings codec at startup; lib-dynload carries the
        # C extension modules (_socket, zlib, ...) and must come along.
        test -f "${DST}/encodings/__init__.py"
        ls "${DST}/lib-dynload" >/dev/null

    - name: Build AppImage
      env:
        LINUXDEPLOY_OUTPUT_VERSION: ${{ env.PKG_VERSION }}
      run: |
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage
        # No Qt plugin any more: GLFW loads X11/Wayland/GL from the host at runtime,
        # linuxdeploy bundles the rest (libpython, libnl, libusb, libcanlib).
        ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage
        ls -la Kraken*.AppImage

    - name: Upload DEB package
      uses: actions/upload-artifact@v6
      with:
        name: KrakenExplorer-Linux-DEB
        path: "build/*.deb"

    - name: Upload AppImage
      uses: actions/upload-artifact@v6
      with:
        name: KrakenExplorer-Linux-AppImage
        path: "Kraken*.AppImage"

  windows:
    name: Windows (MinGW-w64) tests + zip + installer
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # git describe: the version is the newest tag

    # The python.org build: the exe links its python3xx.dll and the zip ships the embeddable
    # package of the same version. MSYS2's own Python is a different ABI and must not be found.
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - name: Set up MinGW-w64 (MSYS2 UCRT64)
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja

    # build_win_zip.ps1 builds the setup.exe when it finds Inno Setup.
    - name: Set up Inno Setup
      shell: pwsh
      run: |
        if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

    - name: Build, zip and installer
      shell: pwsh
      env:
        # Tests on: the same build tree runs ctest below.
        CMAKE_ARGS: -DKRAKEN_TESTS=ON -DPython_ROOT_DIR=${{ env.pythonLocation }} -DPython_FIND_STRATEGY=LOCATION -DPython_FIND_REGISTRY=NEVER ${{ env.SCCACHE_ARGS }}
        SCCACHE_GHA_ENABLED: "true"
      run: |
        $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
        g++ --version
        scripts\build_win_zip.ps1 -Build build
        if (-not (Test-Path build\kraken-explorer-*-win64-setup.exe)) { throw "no setup.exe built" }
        sccache --show-stats

    - name: Build and run tests
      shell: pwsh
      env:
        SCCACHE_GHA_ENABLED: "true"
      run: |
        $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
        cmake --build build
        ctest --test-dir build --output-on-failure

    - name: Upload zip
      uses: actions/upload-artifact@v6
      with:
        name: KrakenExplorer-Windows-zip
        path: "build/kraken-explorer-*-win64.zip"

    - name: Upload installer
      uses: actions/upload-artifact@v6
      with:
        name: KrakenExplorer-Windows-setup
        path: "build/kraken-explorer-*-win64-setup.exe"
        if-no-files-found: error

  macos:
    name: macOS (doctest, ASan + UBSan; .app + DMG)
    runs-on: macos-26

    env:
      # python.org framework build: embedded by the app and bundled into the .app by
      # scripts/build_macos_app.sh (Homebrew's Python links OpenSSL & co. outside the framework).
      PYTHON_PKG: https://www.python.org/ftp/python/3.14.8/python-3.14.8-macos11.pkg
      PYTHON_FRAMEWORK: /Library/Frameworks/Python.framework/Versions/3.14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # git describe: the version is the newest tag

    - name: Install dependencies
      run: |
        brew install cmake ninja pkg-config libusb pybind11 ccache
        curl -fsSL -o python.pkg "$PYTHON_PKG"
        sudo installer -pkg python.pkg -target /
        echo "PKG_CONFIG_PATH=$PYTHON_FRAMEWORK/lib/pkgconfig" >> "$GITHUB_ENV"

    - *fetch_cache
    - *ccache

    # No vcan on macOS: the SocketCAN tests are compiled out, the rest runs as on Linux.
    - name: Configure
      run: cmake -S . -B build -G Ninja -DKRAKEN_SANITIZE=ON -DPython_ROOT_DIR="$PYTHON_FRAMEWORK" ${{ env.CCACHE_ARGS }}

    - name: Build
      run: cmake --build build && ccache -s

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

    # Homebrew's libusb is built for this runner's macOS only and would raise the bundle's
    # LSMinimumSystemVersion to it (26.0): the bundle ships one built for the deployment target.
    - name: libusb for the deployment target
      run: |
        curl -fsSL -o libusb.tar.bz2 https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2
        mkdir libusb-src && tar -xjf libusb.tar.bz2 -C libusb-src --strip-components 1
        cd libusb-src
        export MACOSX_DEPLOYMENT_TARGET=13.3 # read by clang at compile and link time, so for make too
        ./configure --prefix="$PWD/out" --disable-static >/dev/null
        make -j3 install >/dev/null
        echo "LIBUSB_DYLIB=$PWD/out/lib/libusb-1.0.0.dylib" >> "$GITHUB_ENV"

    - name: Build app bundle and DMG
      env:
        CMAKE_ARGS: ${{ env.CCACHE_ARGS }}
      run: scripts/build_macos_app.sh build/macos

    # No smoke run of the bundle: GitHub's macOS VMs have no OpenGL (GLFW gets no accelerated
    # pixel format). scripts/build_macos_app.sh verifies the signature; run the .app on a Mac.

    - name: Upload DMG
      uses: actions/upload-artifact@v6
      with:
        name: KrakenExplorer-macOS-dmg
        path: "build/macos/kraken-explorer-*-macos-*.dmg"
        if-no-files-found: error

    - *ccache_save

  release:
    name: Release
    if: github.ref_type == 'tag' || inputs.draft_release
    needs: [unit-tests, format-compat, package, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # git describe: the version is the newest tag

    - name: Download packages
      uses: actions/download-artifact@v7
      with:
        path: dist
        pattern: KrakenExplorer-*
        merge-multiple: true

    # A new release starts as a draft so every package is attached before it goes public
    # (required once a release is immutable). An existing release for the tag, draft or
    # published, gets this run's packages.
    - name: Create or update release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # The version is the tag the packages were built from (top-level CMakeLists.txt).
        VERSION=$(git describe --tags --abbrev=0 --match "[0-9]*.[0-9]*.[0-9]*")
        TAG="$VERSION"
        echo "TAG=$TAG" >> "$GITHUB_ENV"
        ls -la dist
        if gh release view "$TAG" >/dev/null 2>&1; then
          gh release upload "$TAG" dist/* --clobber
        else
          gh release create "$TAG" dist/* --draft --generate-notes --target "$GITHUB_SHA" --title "Kraken Explorer $VERSION"
        fi

    # Tag builds publish after every package has been uploaded. A manual branch run only
    # refreshes packages and leaves any draft unpublished.
    - name: Publish release
      if: github.ref_type == 'tag'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
          gh release edit "$TAG" --draft=false
        fi
